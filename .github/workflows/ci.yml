name: CI

on:
  pull_request:
  # Called by release.yml — on every push to main and every tag — so a
  # release is held to exactly the same bar as a pull request rather than to
  # a copy of it that can drift. That call is also main's CI run, which is
  # why there's no push trigger here: it would run the suite twice.
  workflow_call:

jobs:
  test:
    name: fmt, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: make vet
      - run: make test
      # The release workflow's version logic — decides every tag, so it is
      # tested like code.
      - run: bash .github/scripts/next-version_test.sh

  test-integration:
    name: integration tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Pull every container the suite needs at once. Left to itself each
      # package pulls its own as it runs, and the runner only runs a couple
      # of package binaries at a time, so the downloads serialize.
      - run: make pull-images
      - run: make test-integration
