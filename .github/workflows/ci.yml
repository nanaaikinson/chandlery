name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml, so a tag is held to exactly the same bar as a
  # pull request rather than to a copy of it that can drift.
  workflow_call:

jobs:
  test:
    name: fmt, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: make vet
      - run: make test

  test-integration:
    name: integration tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Pull every container the suite needs at once. Left to itself each
      # package pulls its own as it runs, and the runner only runs a couple
      # of package binaries at a time, so the downloads serialize.
      - run: make pull-images
      - run: make test-integration
